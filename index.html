<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operator Dramus - Pro Stage Deck</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-panel: #111827;
            --bg-card: #182234;
            --bg-card-hover: #1f2d44;
            --border-subtle: #283548;
            --accent-blue: #38bdf8;
            --accent-amber: #fbbf24;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-main) 55%);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header / Control Deck */
        header {
            width: 100%;
            max-width: 1240px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.88);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            gap: 16px;
            position: sticky;
            top: 12px;
            z-index: 100;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
        }

        .title-area h1 {
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .title-area small {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .kbd {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.75rem;
            color: #e2e8f0;
            font-family: monospace;
        }

        .master-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .vol-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            font-size: 0.85rem;
        }

        input[type="range"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .btn-next {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #022c22;
            border: none;
            padding: 11px 20px;
            font-size: 0.92rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #065f46, 0 6px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.1s ease;
        }

        .btn-next:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #065f46;
        }

        .btn-stop-all {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 0.92rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #991b1b, 0 6px 15px rgba(239, 68, 68, 0.3);
            transition: all 0.1s ease;
        }

        .btn-stop-all:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #991b1b;
        }

        /* Grid Cue Cards */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1240px;
        }

        .cue-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 14px;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .cue-card:hover {
            border-color: var(--accent-blue);
            background-color: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        /* Kartu Khusus Musik / Backsound */
        .cue-card.is-music {
            border-left: 5px solid var(--accent-purple);
            background: linear-gradient(145deg, #1e1b4b, #182234);
        }

        /* Antrean Berikutnya */
        .cue-card.up-next {
            border-color: var(--accent-amber);
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.25);
        }

        .cue-card.up-next::after {
            content: "NEXT";
            position: absolute;
            bottom: 42px;
            right: 12px;
            background: var(--accent-amber);
            color: #090d16;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* Sedang Diputar */
        .cue-card.active {
            background: linear-gradient(145deg, #064e3b, #065f46);
            border-color: var(--accent-emerald);
            box-shadow: 0 0 22px rgba(16, 185, 129, 0.45);
            transform: scale(1.01);
        }

        /* Sudah Selesai */
        .cue-card.played {
            opacity: 0.48;
            border-color: #1e293b;
        }

        .cue-card.played:hover {
            opacity: 0.9;
        }

        .cue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .cue-number {
            background: var(--accent-blue);
            color: #090d16;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .is-music .cue-number {
            background: var(--accent-purple);
            color: white;
        }

        .scene-tag {
            font-size: 0.7rem;
            background: rgba(15, 23, 42, 0.7);
            color: var(--accent-amber);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .character-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #93c5fd;
            margin-bottom: 5px;
        }

        .is-music .character-name {
            color: #d8b4fe;
        }

        .cue-quote {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            font-style: italic;
        }

        .cue-footer {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.72rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .cue-card.active .cue-footer {
            color: #6ee7b7;
        }

        /* Progress Bar Audio di Bawah Kartu */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background-color: var(--accent-emerald);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>🎭 PANEL OPERATOR DRAMUS</h1>
            <small>Tekan <span class="kbd">→</span> untuk Next Cue | Tekan <span class="kbd">SPASI</span> untuk Stop Darurat</small>
        </div>
        <div class="master-controls">
            <div class="vol-box">
                <label for="masterVol">🔊 Vol</label>
                <input type="range" id="masterVol" min="0" max="1" step="0.05" value="1" style="width: 85px;">
            </div>
            <button class="btn-next" onclick="playNextCue()">▶ NEXT CUE (→)</button>
            <button class="btn-stop-all" onclick="stopAllAudio()">⏹ STOP (Spasi)</button>
        </div>
    </header>

    <div class="grid-container" id="board"></div>

    <script>
        const cues = [
            // --- OPENING ---
            { id: 0, file: 'intro.mp3', type: 'music', scene: 'Scene 0: Opening', char: 'Opening Backsound', quote: '"Intro pembuka drama musikal"' },

            // --- SCENE 1: RUMAH (TUNGGAKAN SPP) ---
            { id: 1, file: 'bunga (emak gimana udah nunggak spp 3 bulan).opus', scene: 'Scene 1: Lapor SPP', char: 'Bunga', quote: '"Ma, Abah, uang SPP aku udah nunggak 3 bulan..."' },
            { id: 2, file: 'ratu (sabar emak juga).opus', scene: 'Scene 1: Lapor SPP', char: 'Ratu (Emak)', quote: '"Sabar ya Nak, Emak juga lagi berusaha cari uangnya."' },
            { id: 3, file: 'bunga (sekarang mana ada ga hasilnya).opus', scene: 'Scene 1: Lapor SPP', char: 'Bunga', quote: '"Halah, berusaha-berusaha dari kemarin juga bilangnya kayak gitu, sekarang mana ada nggak hasilnya?"' },
            { id: 4, file: 'ratu (bah ini gimana).opus', scene: 'Scene 1: Lapor SPP', char: 'Ratu (Emak)', quote: '"Bah, ini gimana mau sampai kapan anak kita nunggaknya?"' },
            { id: 5, file: 'Daffa (iya ma bapa juga).opus', scene: 'Scene 1: Lapor SPP', char: 'Dafa (Abah)', quote: '"Ya Ma, Bapak juga lagi berusaha buat keluarga kita, sabar ya Ma."' },
            { id: 6, file: 'ratu (yaudah abis ini cari kerja).opus', scene: 'Scene 1: Lapor SPP', char: 'Ratu (Emak)', quote: '"Ya udah habis ini cari lagi pekerjaan."' },

            // --- SCENE 2: SEKOLAH (BULLYING) ---
            { id: 7, file: 'satria (duh sorry bre).opus', scene: 'Scene 2: Sekolah', char: 'Satria', quote: '"Duh, sori bre! Disengaja. Makanya kalau jalan lihat-lihat dong..."' },
            { id: 8, file: 'dhani (hahahah gausah sok sibuk).opus', scene: 'Scene 2: Sekolah', char: 'Dani', quote: '"Hahaha asli Sat, nggak usah sok sibuk belajar deh lu..."' },
            { id: 9, file: 'indira (ih bener banget.opus', scene: 'Scene 2: Sekolah', char: 'Indira', quote: '"Ih, jujur bener banget ya, gue kalau jadi lu sih udah minder parah..."' },
            { id: 10, file: 'anin (makanya tau diri).opus', scene: 'Scene 2: Sekolah', char: 'Anin', quote: '"Makanya tahu diri dong, nggak usah mimpi pengen kelihatan hebat..."' },
            { id: 11, file: 'alvira (kalian ga boleh gitu).opus', scene: 'Scene 2: Sekolah', char: 'Alvira (Pembela)', quote: '"Kalian nggak boleh kayak gitu, Bunga juga punya perasaan."' },
            { id: 12, file: 'indira (alah so pahlawan lu).opus', scene: 'Scene 2: Sekolah', char: 'Indira / Geng', quote: '"Halah, sok pahlawan lu! Dasar pahlawan kesiangan."' },
            { id: 1945, file: 'jagoan.mp3', type: 'music', scene: 'Scene 2: Music', char: 'Backsound - Jagoan', quote: '"Transisi musik adegan sekolah"' },

            // --- SCENE 3: RUMAH (PULANG SEKOLAH & KONFLIK) ---
            { id: 14, file: 'bunga (kayak orang tua lain).opus', scene: 'Scene 3: Pulang Sekolah', char: 'Bunga (Aku)', quote: '"Nggak usah! Kenapa sih kita harus hidup kayak gini?!"' },
            { id: 15, file: 'Daffa (nak kenapa kamu).opus', scene: 'Scene 3: Konflik Ortu', char: 'Dafa (Orang Tua)', quote: '"Hah? Kenapa kamu bicara seperti itu? Kami selalu berusaha yang terbaik..."' },
            { id: 16, file: 'bunga (terbaik apanya).opus', scene: 'Scene 3: Puncak Marah', char: 'Bunga (Aku)', quote: '"Terbaik apanya sih?! Aku capek di-bully di sekolah, aku malu..."' },
            { id: 17, file: 'ratu (bah ini gimana spp).opus', scene: 'Scene 3: Pasca Marah', char: 'Ratu (Emak)', quote: '"Bah, ini gimana anak kita sudah marah sekali."' },
            { id: 18, file: 'Daffa (cari pekerjaan).opus', scene: 'Scene 3: Pasca Marah', char: 'Dafa (Abah)', quote: '"Abah juga lagi nyari 19 juta lapangan pekerjaan itu, sabar ya Ma."' },
            { id: 19, file: 'ratu (yaudah abis ini cari pekerjaan ya).opus', scene: 'Scene 3: Pasca Marah', char: 'Ratu (Emak)', quote: '"Ya udah habis ini jangan lupa cari pekerjaan lagi ya."' },

            // --- SCENE 4: DITEMUI VIKA ---
            { id: 20, file: 'vika ( gue udah cari lu).opus', scene: 'Scene 4: Ditemui Vika', char: 'Vika', quote: '"Gue udah cari lu ke mana-mana Bung, ternyata lu di sini."' },
            { id: 21, file: 'bunga (pergi vik).opus', scene: 'Scene 4: Ditemui Vika', char: 'Bunga (Aku)', quote: '"Pergi Vik, gue lagi mau sendiri. Gue capek sama hidup gue..."' },
            { id: 22, file: 'vika (gue tahu lu cape).opus', scene: 'Scene 4: Nasihat Vika', char: 'Vika', quote: '"Gue tahu lu capek karena di-bully. Tapi apa lu pikir dengan lu melampiaskan..."' },
            { id: 23, file: 'vika (lu egois).opus', scene: 'Scene 4: Nasihat Vika', char: 'Vika', quote: '"Lu egois. Lu marah-marah ke mereka, bentak-bentak mereka..."' },
            { id: 24, file: 'bunga (bener vik aku).opus', scene: 'Scene 4: Sadar', char: 'Bunga (Aku)', quote: '"Lo bener Vik, gua salah. Gua nggak seharusnya ngomong gitu..."' },

            // --- SCENE 5: BERDAMAI DENGAN ORANG TUA ---
            { id: 25, file: 'bunga (emak Abah maapin aku).opus', scene: 'Scene 5: Minta Maaf', char: 'Bunga (Aku)', quote: '"Ma, Abah, maafin aku, aku salah banget tadi..."' },
            { id: 26, file: 'Daffa (iya gapapa nak).opus', scene: 'Scene 5: Dimaafkan', char: 'Dafa (Orang Tua)', quote: '"Iya, nggak apa-apa Nak. Abah juga tahu keadaan kamu sekarang..."' },
            { id: 27, file: 'ratu (iya gapapa nak kita).opus', scene: 'Scene 5: Dimaafkan', char: 'Ratu (Orang Tua)', quote: '"Iya nggak apa-apa Nak, nggak usah minta maaf, kita juga udah maafin kamu kok."' },
            { id: 28, file: 'bunga (iya bah makasi).opus', scene: 'Scene 5: Penutup', char: 'Bunga (Aku)', quote: '"Iya Bah, nggak apa-apa, makasih juga. Sekali lagi aku minta maaf..."' },
            { id: 29, file: 'harta berharga.mp3', type: 'music', scene: 'Scene 5: Penutup', char: 'Backsound - Harta Berharga', quote: '"Musik penutup akustik"' }
        ];

        const audioElements = [];
        const board = document.getElementById('board');
        const volControl = document.getElementById('masterVol');
        let nextIndex = 0;

        cues.forEach((cue, index) => {
            const audio = new Audio(encodeURI(cue.file));
            audioElements[index] = audio;

            const card = document.createElement('button');
            card.className = `cue-card ${cue.type === 'music' ? 'is-music' : ''}`;
            if (index === 0) card.classList.add('up-next');
            card.id = `card-${index}`;
            card.onclick = () => toggleCue(index);

            const icon = cue.type === 'music' ? '🎵' : '🎙️';

            card.innerHTML = `
                <div>
                    <div class="cue-header">
                        <span class="cue-number">CUE #${cue.id}</span>
                        <span class="scene-tag">${cue.scene}</span>
                    </div>
                    <div class="character-name">${icon} ${cue.char}</div>
                    <div class="cue-quote">${cue.quote}</div>
                </div>
                <div class="cue-footer">
                    <span id="status-${index}"><b>Siap diputar</b></span>
                    <span>📁 ${cue.file}</span>
                </div>
                <div class="progress-bar" id="prog-${index}"></div>
            `;

            board.appendChild(card);

            // Update progress bar berjalan
            audio.ontimeupdate = () => {
                if (audio.duration) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    document.getElementById(`prog-${index}`).style.width = pct + '%';
                }
            };

            // Saat audio selesai
            audio.onended = () => {
                card.classList.remove('active');
                card.classList.add('played');
                document.getElementById(`status-${index}`).innerHTML = '<b>✔ Selesai</b>';
                document.getElementById(`prog-${index}`).style.width = '0%';
            };
        });

        function updateNextHighlight(currentIndex) {
            document.querySelectorAll('.cue-card').forEach(c => c.classList.remove('up-next'));
            nextIndex = currentIndex + 1;
            const nextCard = document.getElementById(`card-${nextIndex}`);
            if (nextCard) {
                nextCard.classList.add('up-next');
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function toggleCue(index) {
            const audio = audioElements[index];
            const card = document.getElementById(`card-${index}`);
            const status = document.getElementById(`status-${index}`);

            if (!audio.paused) {
                audio.pause();
                audio.currentTime = 0;
                card.classList.remove('active');
                status.innerHTML = '<b>Dihentikan</b>';
                document.getElementById(`prog-${index}`).style.width = '0%';
                return;
            }

            stopAllAudio();

            audio.volume = volControl.value;
            audio.play().then(() => {
                card.classList.add('active');
                status.innerHTML = '<b>▶ SEDANG BUNYI...</b>';
                updateNextHighlight(index);
            }).catch(err => {
                alert(`Gagal memutar "${cues[index].file}". Pastikan file berada di folder yang sama persis dengan file HTML ini.`);
            });
        }

        function playNextCue() {
            if (nextIndex < cues.length) {
                toggleCue(nextIndex);
            }
        }

        function stopAllAudio() {
            audioElements.forEach((audio, index) => {
                if (!audio.paused) {
                    audio.pause();
                    audio.currentTime = 0;
                }
                const card = document.getElementById(`card-${index}`);
                card.classList.remove('active');
                document.getElementById(`prog-${index}`).style.width = '0%';
                if (!card.classList.contains('played')) {
                    document.getElementById(`status-${index}`).innerHTML = '<b>Siap diputar</b>';
                }
            });
        }

        volControl.addEventListener('input', (e) => {
            audioElements.forEach(audio => {
                audio.volume = e.target.value;
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                stopAllAudio();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                playNextCue();
            }
        });
    </script>
</body>
</html>
